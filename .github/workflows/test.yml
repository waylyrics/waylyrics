name: Build, Test & upload
on:
  push:
    branches:
      - master
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'metainfo/*.gschema.xml'
    tags:
      - v*
  pull_request:
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'metainfo/*.gschema.xml'
env:
  CARGO_TERM_COLOR: always
  WAYLYRICS_THEME_PRESETS_DIR: /usr/share/waylyrics/themes
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo rm /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libdbus-1-dev pkg-config weston
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --features offline-test
      - name: Build
        run: cargo build --release
      - name: Installation
        run: |
          sudo mkdir -p /usr/share/waylyrics
          sudo install -m644 metainfo/io.github.waylyrics.Waylyrics.gschema.xml /usr/share/glib-2.0/schemas/
          sudo install -dm755 ${WAYLYRICS_THEME_PRESETS_DIR}
          sudo cp -r themes/* ${WAYLYRICS_THEME_PRESETS_DIR}/

          # install schema
          sudo glib-compile-schemas /usr/share/glib-2.0/schemas/
      - name: Start waylyrics
        run: |
          # init weston
          weston --backend=headless-backend.so -Swayland-1 &
          # let weston prepare for 1s
          sleep 1

          # start waylyrics
          ret=-1
          WAYLAND_DISPLAY=wayland-1 RUST_BACKTRACE=1 timeout 5s ./target/release/waylyrics || ret=$?

          if [ $ret -eq 124 ]; then
            echo "waylyrics survived the smoke test"
            exit 0
          else
            echo "waylyrics crashed during the smoke test (exit code $ret)"
            exit 1
          fi
      - name: Prepare assets
        shell: bash
        run: |
          tar -cvzf amd64-linux-gnu.tar.gz target/release/waylyrics \
          LICENSE res metainfo/io.github.waylyrics.Waylyrics.{gschema.xml,desktop}
      - name: Declare some variables # https://stackoverflow.com/a/61699863
        id: vars
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: amd64-linux-gnu.tar.gz
  update-aur-pkgbuild:
    name: 'Update AUR PKGBUILD'
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: 'build'
    steps:
      - name: 'Setup Git'
        run: |
          echo -e "${{ secrets.AUR_PRIVATE_KEY }}" | install -Dm600 /dev/stdin ~/.ssh/id_ed25519
          chmod 700 ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Clone AUR repository'
        run: git clone "ssh://aur@aur.archlinux.org/waylyrics.git"
      - name: 'Get current status'
        id: current
        run: |
          source waylyrics/PKGBUILD
          echo "main_sha256=${sha256sums[0]}" >> "$GITHUB_OUTPUT"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
      - name: 'Get target status'
        id: target
        # /usr/share/makepkg/source/git.sh
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: |
          echo -n "main_sha256=" >> "$GITHUB_OUTPUT"
          git -c core.abbrev=no archive --format tar '${{ github.ref_name }}' | sha256sum | cut -d " " -f 1 >> "$GITHUB_OUTPUT"
          echo -n "pkgver=" >> "$GITHUB_OUTPUT"
          echo '${{ github.ref_name }}' | sed 's/v//' >> "$GITHUB_OUTPUT"
      - name: 'Update pkgver'
        run: |
          current_pkgver='${{ steps.current.outputs.pkgver }}'
          current_sha256='${{ steps.current.outputs.main_sha256 }}'
          target_pkgver='${{ steps.target.outputs.pkgver }}'
          target_sha256='${{ steps.target.outputs.main_sha256 }}'
          sed -i waylyrics/PKGBUILD \
            -e "s/$current_pkgver/$target_pkgver/" \
            -e "s/$current_sha256/$target_sha256/"
      - name: 'Show diff'
        id: diff
        run: |
          if git -C waylyrics --no-pager diff --exit-code PKGBUILD
          then
            echo "PKGBUILD is not updated."
            echo updated=false >> "$GITHUB_OUTPUT"
          else
            echo "PKGBUILD is updated."
            echo updated=true >> "$GITHUB_OUTPUT"
          fi
      - name: 'Install makepkg'
        if: steps.diff.outputs.updated == 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install pacman-package-manager -y
      - name: 'Update .SRCINFO'
        if: steps.diff.outputs.updated == 'true'
        run: makepkg -D waylyrics --printsrcinfo > waylyrics/.SRCINFO
      - name: 'Print diff'
        if: steps.diff.outputs.updated == 'true'
        run: git -C waylyrics --no-pager diff
      - name: 'Commit'
        if: steps.diff.outputs.updated == 'true'
        run: |
          git -C waylyrics add .
          git -C waylyrics commit -m "Bump version to ${{ steps.pkgver.outputs.pkgver }}"
      - name: 'Push'
        if: steps.diff.outputs.updated == 'true'
        run: git -C waylyrics push origin master
